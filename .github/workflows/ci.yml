name: CI

# Uma só entrada: `main`. Nada de builds em branches de trabalho, para não
# gastar minutos de CI nem deploys de pré-visualização que ninguém vai abrir.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      browsers:
        description: "Correr também Firefox e WebKit (matriz completa)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  # ── Fase 1 ────────────────────────────────────────────────────────────────
  # O mais barato primeiro: se os tipos ou o lint falham, nada mais arranca.
  quality:
    name: "1 · Tipos, lint e dependências"
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1

      - name: Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: npm
        run: npm install --global npm@12.2.0

      - name: Instalar dependências
        run: npm ci --engine-strict=false

      - name: Tipos
        run: npm run type-check

      - name: Lint
        run: npm run lint

      - name: Vulnerabilidades de produção (alto/crítico)
        run: npm audit --omit=dev --audit-level=high

  # ── Fase 2 ────────────────────────────────────────────────────────────────
  test:
    name: "2 · Testes de unidade"
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@12.2.0
      - run: npm ci --engine-strict=false
      - run: npm run test

  # ── Fase 3 ────────────────────────────────────────────────────────────────
  # Um só build, reutilizado pelos browsers através de artefacto.
  build:
    name: "3 · Build de produção"
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@12.2.0
      - run: npm ci --engine-strict=false

      - name: Cache do Next.js
        uses: actions/cache@v6.1.0
        with:
          path: ${{ github.workspace }}/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.css') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('**/package-lock.json') }}-

      - name: Build
        run: npm run build

      - name: Guardar o build para os browsers
        uses: actions/upload-artifact@v7.0.2
        with:
          name: next-build
          # `.next` começa por ponto, por isso as acções escondem-no sem esta
          # opção; a cache do compilador não interessa aos browsers.
          include-hidden-files: true
          path: |
            .next
            !.next/cache
          retention-days: 2

  # ── Fase 4 ────────────────────────────────────────────────────────────────
  # Um browser é a rede de segurança de todos os dias: é o que o utilizador
  # tem à frente e gasta metade dos minutos dos três motores juntos.
  e2e:
    name: "4 · Browser / chromium"
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@12.2.0
      - run: npm ci --engine-strict=false

      - name: Recuperar o build
        uses: actions/download-artifact@v8.0.2
        with:
          name: next-build
          path: .next

      - name: Instalar motor e dependências
        run: npx playwright install --with-deps chromium

      - name: Testes de browser
        run: npm run test:browser -- --project=chromium

      - name: Relatório de falha
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-failure-chromium
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # Firefox e WebKit só quando alguém os pede no GitHub Actions ("Run workflow").
  e2e-full:
    name: "4b · Browser / ${{ matrix.browser }}"
    if: github.event_name == 'workflow_dispatch' && inputs.browsers
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        browser: [firefox, webkit]
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm install --global npm@12.2.0
      - run: npm ci --engine-strict=false

      - name: Recuperar o build
        uses: actions/download-artifact@v8.0.2
        with:
          name: next-build
          path: .next

      - name: Instalar motor e dependências
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Testes de browser
        run: npm run test:browser -- --project=${{ matrix.browser }}

      - name: Relatório de falha
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: browser-failure-${{ matrix.browser }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # ── Fase 5 ────────────────────────────────────────────────────────────────
  # O Vercel já publica `main` pela integração Git. Se quiseres o deploy
  # estritamente depois dos testes, cria um Deploy Hook e guarda-o no segredo
  # VERCEL_DEPLOY_HOOK: este passo passa a ser a única porta de entrada.
  deploy:
    name: "5 · Deploy (Vercel)"
    needs: [test, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pedir deploy
        env:
          HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$HOOK" ]; then
            echo "Sem VERCEL_DEPLOY_HOOK: o deploy segue pela integração Git do Vercel (só main)."
            exit 0
          fi
          curl --fail --silent --show-error --request POST "$HOOK"
          echo "Deploy pedido ao Vercel."
